# Dev local: Postgres en 5433 (no choca con un Postgres local en 5432).
# La app corre fuera de Docker con `pnpm dev` en :3000.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: copa_user
      POSTGRES_PASSWORD: copa_user
      POSTGRES_DB: copa_quiniela
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copa_user -d copa_quiniela"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
